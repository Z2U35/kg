<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Knowledge Graph Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
        }
        #sidebar {
            width: 200px;
            padding: 20px;
            background-color: #f4f4f4;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            overflow-y: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        #menu {
            display: flex;
            flex-direction: row; /* 确保按钮在同一行显示 */
        }
        .menu-item {
            position: relative;
            margin-right: 10px;
        }
        .menu-item > button {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 4px;
            transition: background-color 0.3s;
            text-align: left;
        }
        .menu-item > button:hover, .menu-item > button.selected {
            background-color: #0056b3;
        }
        .menu-item > .submenu {
            display: none;
            position: absolute;
            left: 0;
            top: 100%;
            background-color: #f4f4f4;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            z-index: 1;
            width: 100%;
        }
        .submenu button {
            width: 100%;
            padding: 10px;
            border: none;
            background-color: #007bff;
            color: white;
            text-align: left;
            border-radius: 0;
            margin: 0;
            cursor: pointer;
        }
        .submenu button:hover {
            background-color: #0056b3;
        }
        .menu-item:hover > .submenu {
            display: block;
        }
        #content {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        #defaultMessage {
            font-size: 24px;
            color: #555;
        }
        #interestContainer {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        #interestContainer text {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        #listContainer ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #listContainer ul li {
            padding: 10px;
            margin: 5px 0;
            background-color: #e9e9e9;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }
        #listContainer ul li:hover {
            background-color: #d6d6d6;
            transform: scale(1.02);
        }
    </style>
</head>
<body>
<div id="sidebar">
    <div id="menu">
        <div class="menu-item">
            <button onclick="showContent('pages/上下位500.html', this)">图谱</button>
            <div class="submenu">
                <button onclick="showContent('pages/上下位500.html', this)">上下位</button>
                <button onclick="showContent('pages/产出500.html', this)">产出</button>
                <button onclick="showContent('pages/先后500.html', this)">先后</button>
                <button onclick="showContent('pages/关联500.html', this)">关联</button>
                <button onclick="showContent('pages/因果500.html', this)">因果</button>
                <button onclick="showContent('pages/实例500.html', this)">实例</button>
                <button onclick="showContent('pages/方式500.html', this)">方式</button>
                <button onclick="showContent('pages/相似500.html', this)">相似</button>
                <button onclick="showContent('pages/组成500.html', this)">组成</button>
                <button onclick="showContent('pages/输入500.html', this)">输入</button>
            </div>
        </div>
        <div class="menu-item">
            <button onclick="showContent('segmentation.html', this)">结果对比</button>
            <div class="submenu">
                <button onclick="showContent('segmentation.html', this)">分割</button>
                <button onclick="showContent('detection.html', this)">检测</button>
            </div>
        </div>
    </div>
    <div id="interestContainer">
        <text>可能还对如下内容感兴趣：</text>
        <div id="listContainer"></div>
    </div>
</div>
<div id="content">
    <iframe id="iframeContent" src="pages/上下位500.html"></iframe>
</div>

<script>
    function loadNeighbours() {
        const listContainer = document.getElementById("listContainer");
        const nodesData = JSON.parse(localStorage.getItem("nodesData"));

        // 清空 listContainer 的内容
        listContainer.innerHTML = "";

        const ul = document.createElement("ul");

        if (nodesData && nodesData.length > 0) {
            // 只取前 15 条数据
            nodesData.slice(0, 15).forEach(item => {
                const li = document.createElement("li");
                li.textContent = item.label; // 设置 <li> 的文本为 label 值
                ul.appendChild(li); // 将 <li> 添加到 <ul>
            });
            listContainer.appendChild(ul);
        } else {
            console.log("No nodes data found in localStorage");
        }
    }
    const intervalId = setInterval(loadNeighbours, 2000);

    function showContent(page, element) {
        var iframe = document.getElementById('iframeContent');
        iframe.src = page;

        // 更新主按钮的高亮状态
        var buttons = document.querySelectorAll('#menu > .menu-item > button');
        buttons.forEach(function(button) {
            button.classList.remove('selected');
        });
        element.classList.add('selected');

        // 在iframe内容加载后处理子菜单中的按钮高亮状态
        iframe.onload = function() {
            var doc = iframe.contentWindow.document;
            var selectedButton = doc.querySelector('button.selected');
            if (selectedButton) selectedButton.classList.remove('selected');

            var targetButton = doc.querySelector('button[value="' + page.split('.')[0] + '"]');
            if (targetButton) targetButton.classList.add('selected');
        };
    }
</script>
</body>
</html>
