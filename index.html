<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Graph Viewer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sidebar">
    <div id="updateTime">
        知识图谱已更新<br>2025年7月17日
    </div>

    <div id="topMenu">
        <div class="menu-item">
            <button onclick="showContent('output.html', this)">结果</button>
        </div>
    </div>

    <div id="graphSection">
        <div class="section-title">知识图谱</div>
        <div id="graphButtons">
            <button class="graph-button selected" onclick="showGraphContent('pages/上下位500.html', this)">上下位</button>
            <button class="graph-button" onclick="showGraphContent('pages/产出500.html', this)">产出</button>
            <button class="graph-button" onclick="showGraphContent('pages/先后500.html', this)">先后</button>
            <button class="graph-button" onclick="showGraphContent('pages/关联500.html', this)">关联</button>
            <button class="graph-button" onclick="showGraphContent('pages/因果500.html', this)">因果</button>
            <button class="graph-button" onclick="showGraphContent('pages/实例500.html', this)">实例</button>
            <button class="graph-button" onclick="showGraphContent('pages/方式500.html', this)">方式</button>
            <button class="graph-button" onclick="showGraphContent('pages/相似500.html', this)">相似</button>
            <button class="graph-button" onclick="showGraphContent('pages/组成500.html', this)">组成</button>
            <button class="graph-button" onclick="showGraphContent('pages/输入500.html', this)">输入</button>
            <button class="graph-button" onclick="showGraphContent('pages/geonomy.html', this)">地学1</button>
            <button class="graph-button" onclick="showGraphContent('pages/geonomy2.html', this)">地学2</button>
        </div>
    </div>

    <div id="interestSection">
        <div class="interest-title">可能感兴趣的内容</div>
        <div id="interestGrid"></div>
    </div>
</div>

<div id="content">
    <div id="iframeWrapper">
        <iframe id="iframeContent" src="pages/上下位500.html"></iframe>
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="js/app.js"></script>
</body>
</html>
