<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>诊断测试</title>
    <script type="text/javascript" src="../lib/interactive-graph-0.1.0/interactive-graph.min.js"></script>
    <link type="text/css" rel="stylesheet" href="../lib/interactive-graph-0.1.0/interactive-graph.min.css">
    <script src="../lib/jquery-3.2.1/jquery-3.2.1.min.js"></script>
    <link rel="stylesheet" href="../lib/jquery-3.2.1/jquery-ui.css">
    <script src="../lib/jquery-3.2.1/jquery-ui.js"></script>
    <link rel="stylesheet" href="css/graph-viewer.css">
    <style>
        body {
            font-family: 'Courier New', monospace;
            padding: 20px;
            background: #1e293b;
            color: #e2e8f0;
        }
        h1 { color: #00d9ff; }
        .success { color: #10b981; font-weight: bold; }
        .error { color: #ef4444; font-weight: bold; }
        .warning { color: #f59e0b; font-weight: bold; }
        #results div { padding: 4px 0; }
        #graphArea {
            background: white;
            border: 2px solid #00d9ff;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🔍 知识图谱诊断测试</h1>
    <div id="results"></div>
    <div id="graphArea" style="width:100%;height:400px;"></div>

    <script src="js/page-config.js"></script>
    <script src="js/graph-viewer.js"></script>
    <script>
        const results = document.getElementById('results');

        function log(msg, type) {
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : type === 'warning' ? 'warning' : '';
            results.innerHTML += '<div class="' + className + '">' + msg + '</div>';
            console.log(msg);
        }

        log('=== 开始诊断 ===', 'info');
        log('');

        log('测试1: 检查必要的库');
        log('- jQuery: ' + (typeof $ !== 'undefined' ? '✅ 已加载' : '❌ 未加载'), typeof $ !== 'undefined' ? 'success' : 'error');
        log('- igraph: ' + (typeof igraph !== 'undefined' ? '✅ 已加载' : '❌ 未加载'), typeof igraph !== 'undefined' ? 'success' : 'error');
        log('');

        log('测试2: 检查配置文件');
        log('- PAGE_CONFIG: ' + (typeof PAGE_CONFIG !== 'undefined' ? '✅ 已加载' : '❌ 未加载'), typeof PAGE_CONFIG !== 'undefined' ? 'success' : 'error');
        log('- getCurrentPageConfig: ' + (typeof getCurrentPageConfig !== 'undefined' ? '✅ 已加载' : '❌ 未加载'), typeof getCurrentPageConfig !== 'undefined' ? 'success' : 'error');
        log('');

        log('测试3: 检查GraphViewer');
        log('- GraphViewer: ' + (typeof GraphViewer !== 'undefined' ? '✅ 已加载' : '❌ 未加载'), typeof GraphViewer !== 'undefined' ? 'success' : 'error');
        log('');

        if (typeof getCurrentPageConfig !== 'undefined') {
            log('测试4: 获取当前页面配置');
            try {
                const config = getCurrentPageConfig();
                log('- 页面配置: ✅ 成功获取', 'success');
                log('  - graphType: ' + config.graphType);
                log('  - nodeCount: ' + config.nodeCount);
                log('  - jsonPath: ' + config.jsonPath);
                log('  - title: ' + config.title);
                log('');

                log('测试5: 尝试加载JSON数据');
                fetch(config.jsonPath)
                    .then(function(response) {
                        if (!response.ok) {
                            throw new Error('HTTP ' + response.status + ': ' + response.statusText);
                        }
                        return response.json();
                    })
                    .then(function(data) {
                        const dataStr = JSON.stringify(data);
                        log('- JSON加载: ✅ 成功 (' + dataStr.length + ' 字符)', 'success');
                        log('');

                        log('测试6: 初始化图谱');
                        try {
                            GraphViewer.init(config);
                            log('- 图谱初始化: ✅ 成功', 'success');
                            log('');
                            log('=== ✅ 所有测试通过！===', 'success');
                        } catch (e) {
                            log('- 图谱初始化: ❌ 失败 - ' + e.message, 'error');
                            console.error(e);
                        }
                    })
                    .catch(function(error) {
                        log('- JSON加载: ❌ 失败 - ' + error.message, 'error');
                        console.error(error);
                    });

            } catch (e) {
                log('- 获取配置: ❌ 失败 - ' + e.message, 'error');
                console.error(e);
            }
        }
    </script>
</body>
</html>
