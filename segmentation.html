<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>分割效果</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            overflow: auto; /* 允许页面滚动 */
        }
        .image-container {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 定义2列布局 */
            grid-template-rows: auto; /* 自动行高 */
            gap: 20px; /* 图片之间的间距 */
            padding: 20px; /* 添加内边距 */
        }
        .image-wrapper {
            width: 1000px; /* 固定宽度 */
            height: 500px; /* 固定高度 */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff; /* 背景色 */
            border: 2px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
<div class="image-container">
    <div class="image-wrapper">
        <img src="images/photo/fengejingdu.png" alt="分割效果">
    </div>
    <div class="image-wrapper">
        <img src="images/photo/newresult1.png" alt="分割结果1">
    </div>
    <div class="image-wrapper">
        <img src="images/photo/newresult2.png" alt="分割结果2">
    </div>
    <div class="image-wrapper">
        <img src="images/photo/newresult3.png" alt="分割结果3">
    </div>
</div>
</body>
</html>
